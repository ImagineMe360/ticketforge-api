services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketforge-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticketforge-api_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ticketforge-api_dev']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: apply migrations, then exit.
  migrate:
    profiles: ['app']
    build:
      context: .
      target: build
    command: pnpm prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ticketforge-api_dev?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ['app']
    build:
      context: .
      target: runtime
    restart: unless-stopped
    ports:
      - '5000:5000'
    env_file: .env
    environment:
      NODE_ENV: production
      COOKIE_SECURE: 'false'
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ticketforge-api_dev?schema=public
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
