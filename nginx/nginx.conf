worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Docker's built-in DNS. Re-resolve "api" every 5s so replicas can come and go.
  resolver 127.0.0.11 valid=5s ipv6=off;

  server_tokens off;

  log_format main '$time_iso8601 $remote_addr req=$request_id "$request" '
                  '$status bytes=$body_bytes_sent time=${request_time}s upstream=$upstream_addr';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  gzip on;
  gzip_min_length 1024;
  gzip_types application/json text/css application/javascript;

  # Coarse edge limiter for credential endpoints: 5 requests/second per client IP.
  limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/s;

  server {
    listen 80;
    client_max_body_size 1m;

    location = /nginx-health {
      access_log off;
      return 200 'ok';
    }

    location /api/v1/auth/ {
      limit_req zone=auth_zone burst=10 nodelay;
      limit_req_status 429;
      set $api_upstream http://api:5000;
      proxy_pass $api_upstream;
      include /etc/nginx/proxy.conf;
    }

    location / {
      set $api_upstream http://api:5000;
      proxy_pass $api_upstream;
      include /etc/nginx/proxy.conf;
    }

    # Errors produced by Nginx itself should look like our API's errors.
    error_page 429 = @rate_limited;
    error_page 502 503 504 = @unavailable;

    location @rate_limited {
      default_type application/json;
      return 429 '{"message":"Too many requests"}';
    }
    location @unavailable {
      default_type application/json;
      return 503 '{"message":"Service temporarily unavailable"}';
    }
  }
}