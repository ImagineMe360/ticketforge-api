openapi: 3.0.0
info:
  title: ticketforge-api API
  description: API documentation for ticketforge-api
  version: 1.0.0
servers:
  - url: /
    description: Current server
paths:
  /health:
    get:
      summary: Health check endpoint
      description: Returns service health status and uptime in seconds.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  uptime:
                    type: number
                    example: 12.34
  /api/v1/users:
    get:
      summary: Get all users
      description: Returns a list of users.
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        email:
                          type: string
                        name:
                          type: string
                        role:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                  - type: object
                    properties:
                      users:
                        type: array
                        items:
                          type: object
  /api/v1/events:
    get:
      summary: Get all events
      description: Returns a paginated list of all events
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A paginated list of events
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        organizationId:
                          type: string
                        title:
                          type: string
                        description:
                          type: string
                        venue:
                          type: string
                        startsAt:
                          type: string
                          format: date-time
                        endsAt:
                          type: string
                          format: date-time
                        status:
                          type: string
                          enum: [DRAFT, PUBLISHED, CANCELLED]
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                        tiers:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              name:
                                type: string
                              priceKobo:
                                type: int
                              capacity:
                                type: int
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /api/v1/events/{id}:
    get:
      responses:
        '200':
          description: A single event with its details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  organizationId:
                    type: string
                  title:
                    type: string
                  description:
                    type: string
                  venue:
                    type: string
                  startsAt:
                    type: string
                    format: date-time
                  endsAt:
                    type: string
                    format: date-time
                  status:
                    type: string
                    enum: [DRAFT, PUBLISHED, CANCELLED]
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  tiers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        priceKobo:
                          type: int
                        capacity:
                          type: int
  /api/v1/auth/register:
    post:
      summary: Register a new user
      description: Creates a new user account with hashed password and default BUYER role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - name
                - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                  example: user@example.com
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: Jane Doe
                password:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 128
                  example: P@ssw0rd123
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                        format: email
                      name:
                        type: string
                      role:
                        type: string
                        enum: [BUYER, ORGANIZER, ADMIN]
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Validation failed
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                  requestId:
                    type: string
        '409':
          description: Account with this email already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: An account with this email already exists
                  requestId:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Something went wrong
                  requestId:
                    type: string
  /api/v1/auth/login:
    post:
      summary: Log in an existing user
      description: Authenticates a user with email and password, creates a session, sets an HTTP-only refresh token cookie, and returns a short-lived access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                  example: user@example.com
                password:
                  type: string
                  format: password
                  minLength: 1
                  maxLength: 128
                  example: P@ssw0rd123
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              description: Sets an HTTP-only cookie with the refresh token (`refresh_token`)
              schema:
                type: string
                example: refresh_token=...; Path=/api/v1/auth; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                        format: email
                      name:
                        type: string
                      role:
                        type: string
                        enum: [BUYER, ORGANIZER, ADMIN]
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                  accessToken:
                    type: string
                    example: eyJhbGciOi...
                  expiresIn:
                    type: integer
                    example: 900
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Validation failed
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                  requestId:
                    type: string
        '401':
          description: Authentication failed (invalid credentials)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invalid email or password
                  requestId:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Something went wrong
                  requestId:
                    type: string
