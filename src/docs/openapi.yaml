openapi: 3.0.0
info:
  title: ticketforge-api API
  description: API documentation for ticketforge-api
  version: 1.0.0
servers:
  - url: /
    description: Current server
paths:
  /health:
    get:
      summary: Health check endpoint
      description: Returns service health status and uptime in seconds.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  uptime:
                    type: number
                    example: 12.34
  /api/v1/users:
    get:
      summary: Get all users
      description: Returns a list of all users. Requires an authenticated user with the ADMIN role.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    email:
                      type: string
                      format: email
                    name:
                      type: string
                    role:
                      type: string
                      enum: [BUYER, ORGANIZER, ADMIN]
                    createdAt:
                      type: string
                      format: date-time
                    updatedAt:
                      type: string
                      format: date-time
        '401':
          description: Unauthorized (missing, invalid, or expired access token)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Authentication required
                  requestId:
                    type: string
        '403':
          description: Forbidden (insufficient permissions, ADMIN role required)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: You do not have permission to perform this action
                  requestId:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Something went wrong
                  requestId:
                    type: string
  /api/v1/events:
    get:
      summary: Get all events
      description: Returns a paginated list of all events
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A paginated list of events
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        organizerId:
                          type: string
                        title:
                          type: string
                        description:
                          type: string
                        venue:
                          type: string
                        startsAt:
                          type: string
                          format: date-time
                        endsAt:
                          type: string
                          format: date-time
                        status:
                          type: string
                          enum: [DRAFT, PUBLISHED, CANCELLED]
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                        tiers:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              name:
                                type: string
                              priceKobo:
                                type: integer
                              capacity:
                                type: integer
                  page: { type: integer }
                  limit: { type: integer }
                  total: { type: integer }
                  totalPages: { type: integer }
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /api/v1/events/{id}:
    get:
      responses:
        '200':
          description: A single event with its details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  organizationId:
                    type: string
                  title:
                    type: string
                  description:
                    type: string
                  venue:
                    type: string
                  startsAt:
                    type: string
                    format: date-time
                  endsAt:
                    type: string
                    format: date-time
                  status:
                    type: string
                    enum: [DRAFT, PUBLISHED, CANCELLED]
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  tiers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        priceKobo:
                          type: int
                        capacity:
                          type: int
  /api/v1/auth/register:
    post:
      summary: Register a new user
      description: Creates a new user account with hashed password and default BUYER role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - name
                - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                  example: user@example.com
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: Jane Doe
                password:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 128
                  example: P@ssw0rd123
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                        format: email
                      name:
                        type: string
                      role:
                        type: string
                        enum: [BUYER, ORGANIZER, ADMIN]
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Validation failed
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                  requestId:
                    type: string
        '409':
          description: Account with this email already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: An account with this email already exists
                  requestId:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Something went wrong
                  requestId:
                    type: string
  /api/v1/auth/login:
    post:
      summary: Log in an existing user
      description: Authenticates a user with email and password, creates a session, sets an HTTP-only refresh token cookie, and returns a short-lived access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                  example: user@example.com
                password:
                  type: string
                  format: password
                  minLength: 1
                  maxLength: 128
                  example: P@ssw0rd123
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              description: Sets an HTTP-only cookie with the refresh token (`refresh_token`)
              schema:
                type: string
                example: refresh_token=...; Path=/api/v1/auth; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                        format: email
                      name:
                        type: string
                      role:
                        type: string
                        enum: [BUYER, ORGANIZER, ADMIN]
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                  accessToken:
                    type: string
                    example: eyJhbGciOi...
                  expiresIn:
                    type: integer
                    example: 900
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Validation failed
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                  requestId:
                    type: string
        '401':
          description: Authentication failed (invalid credentials)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invalid email or password
                  requestId:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Something went wrong
                  requestId:
                    type: string
  /api/v1/auth/refresh:
    post:
      summary: Refresh access token
      description: Rotates the refresh token provided via HTTP-only cookie and issues a new access token. Detects token reuse and revokes the session if reuse is detected.
      parameters:
        - name: refresh_token
          in: cookie
          required: true
          description: Current refresh token stored in an HTTP-only cookie
          schema:
            type: string
      responses:
        '200':
          description: Token refreshed successfully
          headers:
            Set-Cookie:
              description: Sets an HTTP-only cookie with the new rotated refresh token (`refresh_token`)
              schema:
                type: string
                example: refresh_token=...; Path=/api/v1/auth; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                    example: eyJhbGciOi...
                  expiresIn:
                    type: integer
                    example: 900
        '401':
          description: Unauthorized (refresh token missing, invalid, expired, revoked, or reused)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invalid refresh token
                  requestId:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Something went wrong
                  requestId:
                    type: string
  /api/v1/auth/logout:
    post:
      summary: Log out user
      description: Revokes the active session associated with the refresh token cookie and clears the cookie.
      parameters:
        - name: refresh_token
          in: cookie
          required: false
          description: Refresh token cookie to revoke
          schema:
            type: string
      responses:
        '204':
          description: Logged out successfully (session revoked and cookie cleared)
          headers:
            Set-Cookie:
              description: Clears the `refresh_token` cookie
              schema:
                type: string
                example: refresh_token=; Path=/api/v1/auth; Expires=Thu, 01 Jan 1970 00:00:00 GMT; HttpOnly; SameSite=Lax
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Something went wrong
                  requestId:
                    type: string
  /api/v1/auth/me:
    get:
      summary: Get current authenticated user
      description: Returns the profile of the currently logged-in user based on the Bearer access token.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                        format: email
                      name:
                        type: string
                      role:
                        type: string
                        enum: [BUYER, ORGANIZER, ADMIN]
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
        '401':
          description: Unauthorized (missing, invalid, or expired access token, or inactive session)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Authentication required
                  requestId:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Something went wrong
                  requestId:
                    type: string
  /api/v1/auth/sessions:
    get:
      summary: List active sessions
      description: Lists all active and unexpired sessions for the authenticated user, indicating which session is the current one.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of active sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        userAgent:
                          type: string
                          nullable: true
                        ipAddress:
                          type: string
                          nullable: true
                        createdAt:
                          type: string
                          format: date-time
                        lastActiveAt:
                          type: string
                          format: date-time
                        current:
                          type: boolean
        '401':
          description: Unauthorized (missing, invalid, or expired access token, or inactive session)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Authentication required
                  requestId:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Something went wrong
                  requestId:
                    type: string
  /api/v1/auth/sessions/{id}:
    delete:
      summary: Revoke a specific session
      description: Revokes a specific session belonging to the authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the session to revoke
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Session revoked successfully
        '400':
          description: Validation error (invalid UUID format)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Validation failed
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                  requestId:
                    type: string
        '401':
          description: Unauthorized (missing, invalid, or expired access token, or inactive session)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Authentication required
                  requestId:
                    type: string
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Session not found
                  requestId:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Something went wrong
                  requestId:
                    type: string
  /api/v1/auth/logout-all:
    post:
      summary: Log out from all sessions
      description: Revokes all active sessions for the authenticated user and clears the current refresh token cookie.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: All sessions revoked and cookie cleared
          headers:
            Set-Cookie:
              description: Clears the `refresh_token` cookie
              schema:
                type: string
                example: refresh_token=; Path=/api/v1/auth; Expires=Thu, 01 Jan 1970 00:00:00 GMT; HttpOnly; SameSite=Lax
        '401':
          description: Unauthorized (missing, invalid, or expired access token, or inactive session)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Authentication required
                  requestId:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Something went wrong
                  requestId:
                    type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token
