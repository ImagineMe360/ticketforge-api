openapi: 3.0.0
info:
  title: ticketforge-api API
  description: API documentation for ticketforge-api
  version: 1.0.0
servers:
  - url: /
    description: Current server
paths:
  /health:
    get:
      summary: Health check endpoint
      description: Returns service health status and uptime in seconds.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  uptime:
                    type: number
                    example: 12.34
  /api/v1/users:
    get:
      summary: Get all users
      description: Returns a list of users.
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        email:
                          type: string
                        name:
                          type: string
                        role:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                  - type: object
                    properties:
                      users:
                        type: array
                        items:
                          type: object
