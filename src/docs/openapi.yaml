openapi: 3.0.0
info:
  title: ticketforge-api API
  description: API documentation for ticketforge-api
  version: 1.0.0
servers:
  - url: /
    description: Current server
paths:
  /health:
    get:
      summary: Health check endpoint
      description: Returns service health status and uptime in seconds.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  uptime:
                    type: number
                    example: 12.34
  /api/v1/users:
    get:
      summary: Get all users
      description: Returns a list of users.
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        email:
                          type: string
                        name:
                          type: string
                        role:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                  - type: object
                    properties:
                      users:
                        type: array
                        items:
                          type: object
  /api/v1/events:
    get:
      summary: Get all events
      description: Returns a paginated list of all events
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A paginated list of events
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        organizationId:
                          type: string
                        title:
                          type: string
                        description:
                          type: string
                        venue:
                          type: string
                        startsAt:
                          type: string
                          format: date-time
                        endsAt:
                          type: string
                          format: date-time
                        status:
                          type: string
                          enum: [DRAFT, PUBLISHED, CANCELLED]
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                        tiers:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              name:
                                type: string
                              priceKobo:
                                type: int
                              capacity:
                                type: int
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /api/v1/events/{id}:
    get:
      responses:
        '200':
          description: A single event with its details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  organizationId:
                    type: string
                  title:
                    type: string
                  description:
                    type: string
                  venue:
                    type: string
                  startsAt:
                    type: string
                    format: date-time
                  endsAt:
                    type: string
                    format: date-time
                  status:
                    type: string
                    enum: [DRAFT, PUBLISHED, CANCELLED]
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  tiers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        priceKobo:
                          type: int
                        capacity:
                          type: int
